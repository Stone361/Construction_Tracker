spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: construction-tracker
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/construction_tracker?connectionTimeZone=UTC}
    username: ${DB_USERNAME:construction_tracker}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-init-sql: SET time_zone = '+00:00'
      data-source-properties:
        connectionTimeZone: UTC
        forceConnectionTimeZoneToSession: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
    baseline-on-migrate: false
    validate-on-migrate: true
    validate-migration-naming: true
  sql:
    init:
      mode: never
  servlet:
    multipart:
      # The assignment does not define MB in bytes. Use decimal MB explicitly.
      max-file-size: 10000000B
      # Allow multipart framing in addition to the maximum-size single file.
      max-request-size: 11000000B

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

server:
  port: 8080
  tomcat:
    # Drain rejected multipart bodies so clients receive the JSON 413 response.
    max-swallow-size: -1

photos:
  storage-directory: ${PHOTO_STORAGE_DIRECTORY:./data/local/photos}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
