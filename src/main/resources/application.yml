spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: construction-tracker
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/construction_tracker?connectionTimeZone=UTC}
    username: ${DB_USERNAME:construction_tracker}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
