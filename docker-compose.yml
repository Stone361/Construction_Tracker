services:
  mysql:
    image: mysql:8.4.11
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: construction_tracker
      MYSQL_USER: ${DB_USERNAME:-construction_tracker}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      TZ: UTC
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+00:00
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          MYSQL_PWD="$${MYSQL_PASSWORD}" mysql --protocol=TCP --host=127.0.0.1
          --user="$${MYSQL_USER}" --database="$${MYSQL_DATABASE}"
          --silent --skip-column-names --execute='SELECT 1' >/dev/null
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  mysql-data:
